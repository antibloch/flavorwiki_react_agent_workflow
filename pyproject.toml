[project]
name = "flavorai"
version = "0.1.0"
description = "Flavorwiki NL2SQL API using crewAI (and a LangGraph agent variant)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic,google-genai,tools]==1.13.0",
    "fastapi",
    "langchain-core>=1.5.1",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "psycopg2-binary",
    "redis>=8.0.1",
    "sqlalchemy",
    "uvicorn[standard]",
]

[project.scripts]
run_crew = "flavor_ai.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flavor_ai", "src/app"]

[tool.crewai]
type = "crew"
