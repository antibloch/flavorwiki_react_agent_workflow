name: herbalife-agent

services:
  flavorai:
    image: ${APP_IMAGE:?APP_IMAGE must contain an immutable registry image tag}
    pull_policy: always
    restart: unless-stopped
    init: true
    env_file:
      - ./app.env
    environment:
      CONVERSATION_DB_PATH: /app/data/conversation.sqlite3
    volumes:
      - conversation-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  conversation-data:
    name: herbalife-agent-conversation-data
