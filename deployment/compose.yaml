services:
  flavorai:
    build: .
    env_file:
      - .env
    environment:
      CONVERSATION_DB_PATH: /app/data/conversation.sqlite3
    volumes:
      - conversation-data:/app/data
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  conversation-data:
